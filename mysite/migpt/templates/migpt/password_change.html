{% include 'migpt/base.html' %}

{% block content %}
{% if user.is_authenticated %}
  <h1>Change password</h1>

  <form method="POST">
    {% csrf_token %}
    {{ form.as_p }}
    <input type="submit" value="Send me instructions!">
  </form>
{% else %}
  <p>You are not logged in. Login first
  </p>
{% endif %}
{% endblock %}
