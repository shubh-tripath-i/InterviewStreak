{% load static %}
<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>{% block head_title %}MIGPT{% endblock %}</title>
    </head>
<body class="sub_page">
    {% include "migpt/base.html" %}
    {% if interview %}
    <a href="{% url 'migpt:start_interview' %}">Resume last interview</a>
    {% endif %}
        <section class="contact_section layout_padding">
            <div class="container ">
            <div class="heading_container">
                <h2>
                Interview Details
                </h2>
                <img src="{% static 'migpt/images/contact_logo.png' %}" alt="">
            </div>
            </div>
            <div class="container">
            <div class="row">
                <div class="col-md-6">
                <form action="Post">
                    <div>
                    <input type="text" placeholder="Job Role" />
                    </div>
                    <div>
                    <input type="text" placeholder="Company" />
                    </div>
                    <div>
                    <input type="text" class="message-box" placeholder="Job description" />
                    </div>
                    <div class="d-flex ">
                    <button>
                        submit
                    </button>
                    </div>
                </form>
                </div>
                <div class="col-md-6">
                <div class="map_container">
                    <div class="map-responsive">
                    <img src="{% static 'migpt/images/interview.png' %}" alt="">
                    </div>
                </div>
                </div>
            </div>
            </div>
        </section>
</body>
</html>
