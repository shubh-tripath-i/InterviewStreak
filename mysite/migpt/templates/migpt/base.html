{% load static %}
<html>
    <head>
        <!-- Basic -->
        <meta charset="utf-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <!-- Mobile Metas -->
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
        <!-- Site Metas -->
        <meta name="keywords" content="" />
        <meta name="description" content="" />
        <meta name="author" content="" />
        <title>MIGPT</title>
        <link href="{% static 'migpt/css/main.css' %}" rel="stylesheet">
        <link href="{% static 'migpt/css/bootstrap.min.css' %}" rel="stylesheet">
        <!-- slider stylesheet -->
        <link rel="stylesheet" type="text/css" href="https://cdnjs.cloudflare.com/ajax/libs/OwlCarousel2/2.1.3/assets/owl.carousel.min.css" />
        <!-- bootstrap core css -->
        <link href="{% static 'migpt/css/bootstrap.css' %}" type="text/css" rel="stylesheet">
         <!-- fonts style -->
        <link href="https://fonts.googleapis.com/css?family=Poppins:400,600,700&display=swap" rel="stylesheet">
        <!-- responsive style -->
        <link href="{% static 'migpt/css/responsive.css' %}" rel="stylesheet" />
        <link rel="stylesheet" type="text/css" href="migpt/css/bootstrap.css" />
        <script src="{% static 'migpt/js/bootstrap.js' %}"></script>
        <script src="{% static 'migpt/js/jquery-3.4.1.min.js' %}"></script>
        
    </head>
    <body>
            <header class="header_section">
                <div class="container">
                    <nav class="navbar navbar-expand-lg custom_nav-container ">
                        <a class="navbar-brand" href="index.html">
                            <img src="{% static 'migpt/images/ai.png' %}" alt="">
                            <span>
                            MIGPT
                            </span>
                        </a>
                        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
                            <span class="s-1"> </span>
                            <span class="s-2"> </span>
                            <span class="s-3"> </span>
                        </button>
                
                        <div class="collapse navbar-collapse" id="navbarSupportedContent">
                            <div class="d-flex ml-auto flex-column flex-lg-row align-items-center">
                            <ul class="navbar-nav  ">
                                <li class="nav-item active">
                                <a class="nav-link" href="index.html">Home <span class="sr-only">(current)</span></a>
                                </li>
                                <li class="nav-item">
                                <a class="nav-link" href="Product.html"> Product</a>
                                </li>
                                <li class="nav-item">
                                <a class="nav-link" href="about.html"> About US </a>
                                </li>
                                <li class="nav-item">
                                <a class="nav-link" href="contact.html">Contact </a>
                                </li>
                                
                                  {% if not user.is_authenticated %}
                                    <li class="nav-item">
                                        <a class="nav-link" href="{% url 'login' %}">Log IN</a>
                                    </li>
                                    {% else %}
                                    {% endif %}
                                    {% if user.is_authenticated %}
                                    <img class="user-pic" src="{% static 'migpt/images/profile.png' %}" alt="User Profile Icon" onclick="toggleMenu()">
                                    <div class="sub-menu-wrap" id="subMenu">
                                        <div class="sub-menu">
                                            <div class="user-info">
                                                <img class="user-pic" src="{% static 'migpt/images/profile.png' %}" alt="User Profile Icon">
                                                <h5>user name</h5>
                                            </div>
                                            <hr>
                                            <a href="{% url 'migpt:view_profile' %}" class="sub-menu-link">
                                                <img src="{% static 'migpt/images/profile.png' %}" alt="">
                                                <p>View Profile</p>

                                            </a>
                                            <a href="#" class="sub-menu-link">
                                                <img src="{% static 'migpt/images/help.png' %}" alt="">
                                                <p>help & Support</p>
                                            </a>
                                            <a href="{% url 'logout' %}" class="sub-menu-link">
                                                <img src="{% static 'migpt/images/logout.png' %}" alt="">
                                                <p>Logout</p>
                                            </a>

                                        </div>
                                    </div>
                                {% endif %}
                            </ul>
                            </div>
                        </div>
                    </nav>
                </div>
            </header>
        <script>
            let subMenu = document.getElementById("subMenu");
            function toggleMenu(){
                subMenu.classList.toggle("open-menu")
            }
        </script>
    </body>
</html>
